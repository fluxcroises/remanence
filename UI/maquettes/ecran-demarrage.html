<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Remanence, écran de démarrage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 880px; height: 600px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; color: #ececef;">

<sc-for list="{{shards}}" as="s" hint-placeholder-count="80"><div style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.w}}px; height: {{s.h}}px; background: {{s.c}}; opacity: {{s.o}};"></div></sc-for>

<div style="position: absolute; left: 220px; top: 150px; width: 440px; height: 300px; box-sizing: border-box; background: #161618; border: 1px solid #2c2c31; box-shadow: 0 16px 48px #000000b3; padding: 36px 40px 28px; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 16px;">
<svg viewBox="0 0 100 100" width="64" height="64" role="img" aria-label="Symbole Remanence"><defs><clipPath id="sp1"><rect x="0" y="14" width="100" height="13"></rect></clipPath><clipPath id="sp2"><rect x="0" y="28.5" width="100" height="13"></rect></clipPath><clipPath id="sp3"><rect x="0" y="43" width="100" height="13"></rect></clipPath><clipPath id="sp4"><rect x="0" y="57.5" width="100" height="13"></rect></clipPath><clipPath id="sp5"><rect x="0" y="72" width="100" height="14"></rect></clipPath></defs><circle cx="50" cy="50" r="36" fill="#ececef" clip-path="url(#sp1)"></circle><circle cx="56" cy="50" r="36" fill="#ececef" clip-path="url(#sp2)"></circle><circle cx="46" cy="50" r="36" fill="#ececef" clip-path="url(#sp3)"></circle><circle cx="59" cy="50" r="36" fill="{{accent}}" clip-path="url(#sp4)"></circle><circle cx="48" cy="50" r="36" fill="#ececef" clip-path="url(#sp5)"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -0.02em;">Remanence</span>
<span style="font-size: 13px; line-height: 18px; color: #a1a1aa;">Montage et datamosh</span>
</div>
</div>
<div style="flex: 1;"></div>
<div style="height: 1px; background: #2c2c31; margin-bottom: 16px;"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
<span style="font-size: 12px; color: #a1a1aa;">Chargement des effets codec…</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #71717a;">Version 1.0</span>
</div>
<div style="height: 3px; background: #2c2c31; border-radius: 9999px; position: relative; margin-bottom: 16px;"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 64%; background: {{accent}}; border-radius: 9999px;"></div></div>
<div style="font-size: 11px; line-height: 15px; color: #71717a;">Logiciel libre, distribué en code source. Repose sur FFmpeg, FFglitch, Qt et d'autres projets libres : voir À propos.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Orange&quot;,&quot;Violet froid&quot;,&quot;Mauve&quot;],&quot;default&quot;:&quot;Mauve&quot;},&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:600}}">
class Component extends DCLogic {
renderVals() {
const pal = { 'Orange': ['#d9883f', '#4a3220'], 'Violet froid': ['#8f86c4', '#24223a'], 'Mauve': ['#b07cc6', '#33213b'] };
const p = pal[this.props.accent] || pal['Orange'];
const accent = p[0];
let v = 1234;
const r = () => { v = (v * 9301 + 49297) % 233280; return v / 233280; };
const pick = (list) => list[Math.floor(r() * list.length)];
const tones = [
['#2f3d5c', 1], ['#2f3d5c', 1], ['#3a4a6e', 1], ['#1f1f22', 1],
['#ececef', 0.9], ['#ececef', 0.5], [accent, 1], ['#5fb4c0', 1], [p[1], 1]
];
const shards = [];
const burst = (n, edgeX, dir, y0, y1, maxLen) => {
for (let i = 0; i < n; i++) {
const y = Math.round(y0 + r() * (y1 - y0));
const h = pick([3, 4, 6, 8, 10, 14, 18]);
const len = Math.round(30 + Math.pow(r(), 0.7) * maxLen);
const t = pick(tones);
const x = dir < 0 ? edgeX - len + 24 : edgeX - 24;
shards.push({ x: x, y: y, w: len, h: h, c: t[0], o: t[1] });
if (r() < 0.55) {
const s = pick([4, 6, 8]);
const gap = Math.round(6 + r() * 30);
const px = dir < 0 ? x - gap - s : x + len + gap;
shards.push({ x: px, y: y + Math.round(r() * h), w: s, h: s, c: t[0], o: t[1] });
}
}
};
burst(34, 220, -1, 140, 460, 200);
burst(16, 660, 1, 130, 260, 190);
burst(14, 660, 1, 330, 470, 170);
burst(8, 440, 1, 120, 150, 120);
return { shards: shards, accent: accent };
}
}
</script>
</body>
</html>
